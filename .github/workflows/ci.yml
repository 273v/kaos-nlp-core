name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ────────────── lint (Python + Rust) ──────────────
  lint:
    name: Lint
    runs-on: kaos-x64-16core
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo clippy (no PyO3 features)
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev --python 3.13

      - name: Ruff format check
        run: uv run ruff format --check python/kaos_nlp_core tests

      - name: Ruff lint
        run: uv run ruff check python/kaos_nlp_core tests

      - name: Type check (ty)
        run: uv run ty check python/kaos_nlp_core tests

  # ────────────── pre-commit ──────────────
  pre-commit:
    name: Pre-commit hooks
    runs-on: kaos-x64-16core
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev --python 3.13

      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure

  # ────────────── Rust unit tests (pure Rust core) ──────────────
  rust-test:
    name: Rust tests (no PyO3)
    runs-on: kaos-x64-16core
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cargo test (--no-default-features)
        run: cargo test --no-default-features --lib

  # ────────────── Python tests (Python × maturin develop) ──────────────
  test:
    name: Test (${{ matrix.display-os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Linux x64 (self-hosted) keeps the full 4-Python-version matrix
    # for fast PR feedback. macOS-arm64 + Windows-x64 each get a single
    # Python 3.13 leg, gated experimental until proven stable. Mirrors
    # the pattern landed in kaos-core ci.yml (E1) and kaos-graph (E3).
    #
    # The fixture-download steps below use bash scripts (`bash
    # tests/fixtures/download_fixtures.sh` and an `ls -lh` verifier).
    # `shell: bash` on those steps points the runner at Git Bash on
    # Windows, which is preinstalled on `windows-latest`. The
    # actions/cache key is OS-namespaced implicitly so each OS's first
    # run downloads its own fixture cache — subsequent runs hit it.
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x64 (self-hosted) — full Python matrix ──
          - python-version: "3.13"
            os: kaos-x64-16core
            display-os: linux-x64
            experimental: false
          - python-version: "3.14"
            os: kaos-x64-16core
            display-os: linux-x64
            experimental: false
          - python-version: "3.14t"
            os: kaos-x64-16core
            display-os: linux-x64
            experimental: true
          - python-version: "3.15"
            os: kaos-x64-16core
            display-os: linux-x64
            experimental: true
          # ── macOS arm64 — single Python smoke ──
          - python-version: "3.13"
            os: macos-14
            display-os: macos-arm64
            experimental: true
          # ── Windows x64 — single Python smoke ──
          - python-version: "3.13"
            os: windows-latest
            display-os: windows-x64
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    env:
      # PEP 540 "UTF-8 Mode": forces every Python invocation in this
      # job to use UTF-8 for stdin/stdout/stderr AND `open()` default
      # encoding AND filesystem encoding. Windows runners default to
      # the cp1252 codepage which crashes on:
      #   * `UnicodeEncodeError: 'charmap' codec can't encode character ✓`
      #     (HF fixture downloader prints Unicode status markers — E2
      #     first-run).
      #   * `UnicodeDecodeError: 'charmap' codec can't decode byte 0x9d`
      #     when tests `open(...)` Gutenberg fixture text files without
      #     an explicit encoding= (E2 retry).
      # Setting PYTHONUTF8=1 fixes both and is a no-op on Linux/macOS.
      # `PYTHONIOENCODING=utf-8` is belt-and-suspenders for older
      # interpreters or Python distributions that don't honor PEP 540.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-suffix: test-${{ matrix.display-os }}-py${{ matrix.python-version }}

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install --preview ${{ matrix.python-version }}

      - name: Install dependencies
        continue-on-error: ${{ matrix.experimental }}
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Build PyO3 extension (maturin develop --release)
        continue-on-error: ${{ matrix.experimental }}
        run: uv run maturin develop --release

      # ─── Test fixture downloads (cached) ────────────────────────────
      # The retrieval / lexicon / segmentation / integration test suites
      # need real corpora (~370 MB total). Cache key is pinned to the
      # downloader scripts' hash so a script change invalidates and
      # re-downloads; otherwise it's a free no-op after the first CI run.
      - name: Cache HF + Gutenberg test fixtures
        id: fixture-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            tests/fixtures/usc.jsonl
            tests/fixtures/edgar_agreements.jsonl
            tests/fixtures/patents.jsonl
            tests/fixtures/war_and_peace.txt
            tests/fixtures/shakespeare.txt
          key: fixtures-v1-${{ hashFiles('tests/fixtures/download_hf_fixtures.py', 'tests/fixtures/download_fixtures.sh') }}

      # Pin the downloader to Python 3.13: `datasets` pulls `pyarrow` which
      # bundles PyO3 0.26 — that doesn't support 3.15 yet, so building
      # pyarrow from source fails on the 3.15 matrix entry. The downloaded
      # JSONL files are interpreter-agnostic, so it doesn't matter that
      # they're produced with 3.13.
      - name: Install Python 3.13 (for fixture download tool)
        continue-on-error: ${{ matrix.experimental }}
        if: steps.fixture-cache.outputs.cache-hit != 'true' && matrix.python-version != '3.13'
        run: uv python install 3.13

      - name: Download HF fixtures (usc / edgar_agreements / patents)
        continue-on-error: ${{ matrix.experimental }}
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        # `shell: bash` so the multi-line `\` continuation parses on
        # Windows (PowerShell would read `\` as a unary operator).
        # Git Bash is preinstalled on `windows-latest`. Lesson from
        # kaos-core E1 first-run.
        shell: bash
        run: |
          uv run --python 3.13 \
            --with huggingface_hub,tokenizers,datasets \
            python tests/fixtures/download_hf_fixtures.py

      - name: Download Project Gutenberg fixtures (war_and_peace / shakespeare)
        continue-on-error: ${{ matrix.experimental }}
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        # The script is `#!/usr/bin/env bash`; explicit `shell: bash`
        # keeps the invocation portable across Git Bash on Windows.
        shell: bash
        run: bash tests/fixtures/download_fixtures.sh

      - name: Verify fixtures present (cache + downloads)
        continue-on-error: ${{ matrix.experimental }}
        # `ls -lh` is bash-only; pin the shell so Windows uses Git Bash.
        shell: bash
        run: |
          ls -lh tests/fixtures/usc.jsonl \
                 tests/fixtures/edgar_agreements.jsonl \
                 tests/fixtures/patents.jsonl \
                 tests/fixtures/war_and_peace.txt \
                 tests/fixtures/shakespeare.txt

      - name: Run tests with coverage
        continue-on-error: ${{ matrix.experimental }}
        shell: bash
        run: |
          uv run pytest \
            -m "not live and not network and not slow" \
            --cov=kaos_nlp_core \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            tests/

      - name: Upload coverage report
        if: always() && !matrix.experimental
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.display-os }}-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  # ────────────── min-deps ──────────────
  min-deps:
    name: Test against minimum dependencies
    runs-on: kaos-x64-16core
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install with lowest-direct resolution
        run: uv sync --group dev --resolution=lowest-direct --python 3.13

      - name: Build PyO3 extension
        run: uv run maturin develop --release

      - name: Cache HF + Gutenberg test fixtures
        id: fixture-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            tests/fixtures/usc.jsonl
            tests/fixtures/edgar_agreements.jsonl
            tests/fixtures/patents.jsonl
            tests/fixtures/war_and_peace.txt
            tests/fixtures/shakespeare.txt
          key: fixtures-v1-${{ hashFiles('tests/fixtures/download_hf_fixtures.py', 'tests/fixtures/download_fixtures.sh') }}

      - name: Download HF fixtures (pinned to Python 3.13 for pyarrow/PyO3 compat)
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          uv run --python 3.13 \
            --with huggingface_hub,tokenizers,datasets \
            python tests/fixtures/download_hf_fixtures.py

      - name: Download Gutenberg fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: bash tests/fixtures/download_fixtures.sh

      - name: Run tests
        run: |
          uv run pytest \
            -m "not live and not network and not slow" \
            --no-cov \
            -q \
            tests/

  # ────────────── build + wheel smoke test ──────────────
  build:
    name: Build distribution + smoke test
    runs-on: kaos-x64-16core
    needs: [lint, test, rust-test]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Build wheel + sdist
        run: uv build

      - name: Verify metadata (twine check)
        run: uvx --from twine twine check --strict dist/*

      - name: Smoke-test the built wheel in a clean venv
        run: |
          uv venv --python 3.13 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/kaos_nlp_core-*-cp*.whl
          /tmp/smoke/bin/python -c "
          import kaos_nlp_core
          from importlib.metadata import version
          from kaos_nlp_core.tokenizer import Tokenizer
          from kaos_nlp_core.structures import InvertedIndex
          from kaos_nlp_core.lexicon import default_opengloss_lexicon

          assert kaos_nlp_core.__version__, 'version missing from wheel'
          assert kaos_nlp_core.__version__ == version('kaos-nlp-core'), \
              'version drift between module and dist-info'

          # Tokenizer.tokenize returns list[TokenSpan]; check the .text attr.
          tok = Tokenizer(lowercase=True)
          spans = tok.tokenize('Hello, world.')
          assert [s.text for s in spans] == ['hello', 'world'], \
              f'unexpected tokenize output: {spans!r}'

          # BM25 round-trip via InvertedIndex.
          idx = InvertedIndex.build_batch([(0, ['the', 'quick', 'brown', 'fox']),
                                           (1, ['a', 'lazy', 'dog'])])
          hits = idx.query_bm25(['quick', 'fox'], top_k=2)
          assert hits and hits[0].doc_id == 0

          # Wheel-vendored embedded lexicon must load with no env var.
          lex = default_opengloss_lexicon()
          assert len(lex) > 100_000, f'embedded lexicon too small: {len(lex):,}'
          assert lex.synonyms('contract'), 'lexicon missing core entries'

          print(f'kaos-nlp-core {kaos_nlp_core.__version__}: smoke OK')
          "
          # Exercise the CLI entrypoint
          /tmp/smoke/bin/kaos-nlp --help >/dev/null

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
