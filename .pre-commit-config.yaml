# Pre-commit hooks for kaos-nlp-core.
#
# Install:
#   uvx pre-commit install
#
# Run on every commit (automatic after install) or manually on the whole tree:
#   uvx pre-commit run --all-files
#
# Hook versions are pinned for reproducibility. The CI workflow runs the same
# checks so local hooks just shorten the feedback loop — they are not a
# substitute for CI.

repos:
  # ───────────── general hygiene ─────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Auto-fixers that must NOT touch verbatim test fixtures (CUAD
      # contracts, public-record SEC filings, government documents, etc.)
      # because rewriting whitespace / line endings invalidates the SHA-256
      # pins in tests/fixtures/*/README.md and changes the bytes our
      # extractor regression suite consumes.
      #
      # Also skip the embedded compressed binary (gzip + zstd) since
      # whitespace-fix on a binary would corrupt it.
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            LICENSE
            |tests/fixtures/(cuad-sample|multi_domain)/.*\.(txt|json|jsonl)
            |python/kaos_nlp_core/data/opengloss-.*\.bin
            |python/kaos_nlp_core/models/default\.npkt\.gz
          )$
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            LICENSE
            |tests/fixtures/(cuad-sample|multi_domain)/.*\.(txt|json|jsonl)
            |python/kaos_nlp_core/data/opengloss-.*\.bin
            |python/kaos_nlp_core/models/default\.npkt\.gz
          )$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        # The wheel-vendored OpenGloss binary (~32 MB v3 KNC, embedded
        # via include_bytes! into _rust.so) is the largest committed
        # artifact. Bump the cap above that size so the check still
        # catches accidental large-file commits without flagging the
        # known asset.
        args: [--maxkb=40000]
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: |
          (?x)^(
            tests/fixtures/(cuad-sample|multi_domain)/.*\.(txt|json|jsonl)
            |python/kaos_nlp_core/data/opengloss-.*\.bin
            |python/kaos_nlp_core/models/default\.npkt\.gz
          )$
      - id: detect-private-key

  # ───────────── ruff (format + lint) ─────────────
  # Pinned to match the dev group in pyproject.toml to avoid drift between
  # local hooks and `uv sync --group dev`.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-format
        files: ^(python/kaos_nlp_core|tests)/.*\.py$
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(python/kaos_nlp_core|tests)/.*\.py$

  # ───────────── ty (type check) ─────────────
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check python/kaos_nlp_core tests
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

  # ───────────── Rust hygiene ─────────────
  # cargo fmt + clippy are cheap on PRs but slow without sccache locally.
  # Run them on push (not every commit) via the `--hook-stage push` option,
  # or skip them locally with `git commit --no-verify` and let CI catch.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --no-default-features --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
